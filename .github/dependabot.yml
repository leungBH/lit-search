version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    # Rebase active Dependabot PRs on top of main instead of merging main
    # into them. Keeps patch-only PRs a single clean commit, which makes
    # review and bisect much easier.
    rebase-strategy: 'auto'
    # Bump the package.json range to the new version rather than recreating
    # the lockfile from scratch. Avoids churn in unrelated transitive deps.
    versioning-strategy: 'increase'
    # Use a simple 'chore' prefix. Without this, dependabot appends
    # the group name as a scope and we end up with double (deps).
    commit-message:
      prefix: 'chore'
    labels:
      - 'dependencies'
      - 'npm'
      # Surface auto-mergeable (patch-only) PRs in the PR list so the
      # team can see "this will land on its own" at a glance. The
      # actual auto-merge happens in dependabot-auto-merge.yml.
      - 'auto-merge:patch'
    # NOTE: We do NOT use `groups` here. Dependabot's `groups` block
    # re-enables dependencies that are listed in `ignore`, which
    # broke our `conf` / `inquirer` blocklist and produced an unsafe
    # PR. The flat `ignore` list below is the single source of truth.
    ignore:
      # CLI surface libraries. Major bumps may break argument parsing
      # or terminal output rendering. They require an explicit PR
      # with a migration note.
      - dependency-name: 'commander'
        update-types: ['version-update:semver-major']
      - dependency-name: 'chalk'
        update-types: ['version-update:semver-major']
      # conf 14+ requires Node 20; the project's `engines` is ">=18".
      # inquirer 14+ has breaking prompt changes; not all are caught
      # by type checking and they would silently break the `init`
      # command. Upgrade these in a dedicated PR after manual review.
      - dependency-name: 'conf'
      - dependency-name: 'inquirer'
