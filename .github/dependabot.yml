version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
    ignore:
      # These are CLI surface libraries. Major bumps may break argument
      # parsing / output rendering. They require an explicit PR with
      # a migration note.
      - dependency-name: 'commander'
        update-types: ['version-update:semver-major']
      - dependency-name: 'chalk'
        update-types: ['version-update:semver-major']
      # conf 14+ requires Node 20; project's engines is ">=18".
      # inquirer 14+ has breaking prompt changes; not all are TypeScript-
      # detectable and may affect interactive init/merge flows.
      - dependency-name: 'conf'
      - dependency-name: 'inquirer'
